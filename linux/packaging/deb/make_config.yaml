display_name: FAClash
# Kept as the id 0.0.x shipped. Renaming it would make dpkg treat this as a
# different package: it would not replace the old one, and both would own
# /opt/FAClash. Only the visible name changes.
package_name: FlClash
maintainer:
  name: chen08209
  email: chen08209@gmail.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-1
  - libsecret-1-0

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'systemctl disable --now flclash-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/flclash-helper.service'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'

supported_mime_type:
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta
  - x-scheme-handler/flclash
  - x-scheme-handler/faclash

keywords:
  - FAClash
  - Clash
  - ClashMeta
  - Proxy

generic_name: FAClash

categories:
  - Network

startup_notify: true

startup_wm_class: com.follow.clash
