script_template: inno_setup.iss
app_id: 728B3532-C74B-4870-9068-BE70FE12A3E6
# Must match `appName` in lib/common/constant.dart: the installer uses it for
# the Run key it removes on uninstall, and launch_at_startup writes that same
# key from the app.
app_name: FAClash
publisher: fa7679
publisher_url: https://github.com/fa7679/FAClash
display_name: FAClash
# Must match BINARY_NAME in windows/CMakeLists.txt. The post-install [Run]
# entry launches this file, so a stale name here fails the install with
# "cannot find ...exe".
executable_name: FAClash.exe
output_base_file_name: FAClash.exe
# Resolved against the project root: flutter_distributor turns this into an
# absolute path via Directory.current.
setup_icon_file: windows\runner\resources\app_icon.ico
locales:
  # Written into the .iss verbatim, so this one stays relative to the generated
  # script in dist/.
  - lang: zh
    file: ..\windows\packaging\exe\ChineseSimplified.isl
  - lang: en
privileges_required: admin